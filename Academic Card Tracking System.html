  <style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f5f0;--sf:#ffffff;--ink:#2b3f38;--mut:#78897f;--pri:#3d7b66;--onpri:#fff;--pri2:#a7c7b7;--acc:#d9c08e;--line:#e5ebe3;--soft:#edf3ee;--bad:#b6665e;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121c18;--sf:#1a2822;--ink:#e6eee9;--mut:#93a89d;--pri:#7cc3a2;--onpri:#10261d;--pri2:#3b6f58;--acc:#d9bd7e;--line:#273a31;--soft:#21332b;--bad:#e0948b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#121c18;--sf:#1a2822;--ink:#e6eee9;--mut:#93a89d;--pri:#7cc3a2;--onpri:#10261d;--pri2:#3b6f58;--acc:#d9bd7e;--line:#273a31;--soft:#21332b;--bad:#e0948b;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;font-weight:600}h1{font-size:28px}
a{color:var(--pri)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}.mut{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:var(--onpri);border:1px solid var(--pri);border-radius:10px;padding:9px 16px;font-weight:600;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn-ghost,.btn.ghost{background:transparent;color:var(--pri);border-color:var(--pri2)}
.btn.sm{padding:5px 11px;font-size:13px}.btn-block{width:100%;padding:11px}
input,select{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}select.sel{width:auto}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-6px)}}@keyframes drift{to{transform:translate(60px,40px) scale(1.15)}}@keyframes grow{from{width:0}}
.reveal{animation:rise .7s ease both;animation-delay:var(--d,0s)}
/* login */
.login-screen{min-height:100vh;display:grid;grid-template-rows:1fr auto;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--bg),var(--soft))}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 18s ease-in-out infinite alternate}
.orb-a{width:380px;height:380px;background:var(--pri2);top:-100px;left:-80px}.orb-b{width:300px;height:300px;background:var(--acc);bottom:-70px;right:-50px;animation-delay:-6s}.orb-c{width:220px;height:220px;background:var(--pri);opacity:.18;top:40%;left:45%;animation-delay:-10s}
.login-wrap{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;max-width:980px;width:100%;margin:auto;padding:32px}
.login-brand{text-align:center}.seal{width:170px;height:170px;border-radius:50%;background:#fff;box-shadow:0 18px 40px #1d3a2f33;animation:float 5s ease-in-out infinite}
.login-brand h1{font-size:36px;line-height:1.1;margin:18px 0 8px}.login-brand h1 span{color:var(--pri)}.tag{color:var(--mut);margin:0}
.login-card{background:var(--sf);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 24px 60px #1d3a2f1f}
.role-tabs{display:flex;background:var(--soft);border-radius:12px;padding:4px;margin-bottom:18px}.role-tab{flex:1;border:0;background:none;padding:8px;border-radius:9px;color:var(--mut);transition:.2s}
.role-tab.is-active{background:var(--sf);color:var(--ink);font-weight:700;box-shadow:0 2px 8px #0001}
.field{display:block;margin-bottom:12px}.field span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.form-error{color:var(--bad);font-size:13px;margin:0 0 10px}.demo-box{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}.demo-title{margin:0 0 8px;font-size:12.5px;color:var(--mut)}
.demo-chips,.chips{display:flex;gap:8px;flex-wrap:wrap}.chips{margin:12px 0}
.chip{border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:6px 14px;font-size:13.5px;transition:.2s}.chip:hover,.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.login-foot{position:relative;text-align:center;color:var(--mut);font-size:12.5px;padding:14px}
/* taskbar */
.taskbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:18px;padding:10px 24px;background:var(--sf);border-bottom:1px solid var(--line);box-shadow:0 2px 12px #1d3a2f0d}
.tb-left{display:flex;gap:10px;align-items:center}.tb-seal{width:42px;height:42px;border-radius:50%;background:#fff}.tb-title{line-height:1.2}.tb-title small,.tb-user small{color:var(--mut);display:block;font-size:12px}
.tb-nav{display:flex;gap:4px}.tb-nav button{border:0;background:none;padding:8px 14px;border-radius:10px;color:var(--mut);font-weight:500;transition:.2s}.tb-nav button:hover{background:var(--soft)}.tb-nav button.on{background:var(--pri);color:var(--onpri)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:12px}.tb-search{position:relative;width:min(300px,34vw)}.tb-search svg{position:absolute;left:12px;top:11px;color:var(--mut)}.tb-search input{padding-left:36px}
.search-pop{position:absolute;right:0;top:46px;width:min(380px,92vw);background:var(--sf);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px #0003;max-height:360px;overflow:auto;animation:pop .2s ease both}
.sr,.empty{padding:9px 14px;border-bottom:1px solid var(--line)}.sr{cursor:pointer}.sr:hover{background:var(--soft)}.sr small{display:block;color:var(--mut)}.empty{color:var(--mut)}
.tb-user{display:flex;gap:10px;align-items:center;line-height:1.2}.avatar,.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--pri2),var(--pri));color:var(--onpri);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}.av.lg{width:64px;height:64px;font-size:22px}
.view{max-width:1200px;margin:0 auto;padding:26px 28px 48px;animation:rise .5s ease both}
/* components */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;margin:0 0 16px}
.ic{width:18px;height:18px;flex:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:0 0 18px}
.stat{display:flex;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 1px 2px #1d3a2f10}.stat b{display:block;font:600 26px/1.1 Fraunces,serif;color:var(--pri)}.stat span{color:var(--mut);font-size:13px}
.stat .ico{width:44px;height:44px;border-radius:12px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 2px #1d3a2f10}.panel h3{font-size:17px;margin-bottom:12px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:16px}.prof{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.br{display:grid;grid-template-columns:minmax(120px,170px) 1fr 32px;gap:10px;align-items:center;margin:9px 0;font-size:13.5px}.br b{text-align:right}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri2),var(--pri));border-radius:9px;animation:grow 1.1s ease both}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}.li small{display:block;color:var(--mut);font-size:12.5px}.li a{font-weight:700;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:10px 0 22px}
.sec{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;transition:.2s}.sec:hover{transform:translateY(-3px);border-color:var(--pri2);box-shadow:0 10px 24px #25634a22}.sec b{display:block;font-family:Fraunces,serif;font-size:16px}.sec small{color:var(--mut)}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}th{background:var(--soft);font-size:12.5px;letter-spacing:.02em}
.gi{width:84px;text-align:center;padding:6px 8px}.gi.bad{border-color:var(--bad);background:#b4534a1c}
.pill{padding:2px 10px;border-radius:99px;background:var(--soft);font-size:12.5px}.pill.bad{color:var(--bad)}.hint{font-size:13px;color:var(--mut);background:var(--soft);padding:9px 12px;border-radius:10px;margin:12px 0}
/* modal, toast, card */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}.modal-scrim{position:absolute;inset:0;background:#0b1a1399}
.modal-box{position:relative;background:var(--sf);border-radius:18px;max-width:820px;width:100%;max-height:92vh;display:flex;flex-direction:column;animation:pop .3s ease both}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line)}.modal-actions{display:flex;gap:8px}.modal-body{overflow:auto;padding:16px;background:var(--soft);display:grid;gap:14px;border-radius:0 0 18px 18px}
.toast-wrap{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60}.toast{background:var(--pri);color:var(--onpri);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #0003;animation:rise .3s ease both}.toast.bad{background:var(--bad);color:#fff}
.card{font:13px/1.4 Inter,sans-serif;color:#1d2b24;background:#fff;border:2px solid #25634a;border-radius:10px;padding:18px}.card .h{display:flex;gap:12px;align-items:center;border-bottom:2px solid #c9a24d;padding-bottom:10px;margin-bottom:10px}.card .crest{width:60px;height:60px;border-radius:50%}
.card h3{font-size:17px;color:#1d3a2f}.card table{min-width:0}.card th{background:#e8efe6;color:#1d3a2f}.card td,.card th{padding:5px 8px;font-size:12.5px;border-color:#e4dfd0}.card .info{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin-bottom:10px}
.sig{display:flex;justify-content:space-around;margin-top:26px;text-align:center;font-size:12px}.sig div{border-top:1px solid #444;padding-top:3px;min-width:150px}
@media(max-width:900px){.taskbar{flex-wrap:wrap;padding:10px 14px}.tb-nav{order:3;width:100%;overflow-x:auto}.tb-user-meta{display:none}.tb-search{width:min(240px,50vw)}.two,.login-wrap{grid-template-columns:1fr}.login-wrap{gap:22px;padding:22px}.view{padding:18px 14px 40px}.seal{width:120px;height:120px}}
@media print{body{background:#fff}body *{visibility:hidden}#printArea,#printArea *{visibility:visible}.modal{position:static;display:block;padding:0}.modal-box{display:block;max-height:none;box-shadow:none;background:none}#printArea{position:absolute;left:0;top:0;width:100%;padding:0;background:#fff;display:block;overflow:visible}.noprint{display:none!important}.card{page-break-after:always;margin:0}.card:last-child{page-break-after:auto}@page{margin:12mm}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== calm dashboard refresh ===== */
body{background:radial-gradient(900px 520px at 6% -8%,color-mix(in srgb,var(--pri2) 30%,transparent),transparent),radial-gradient(800px 480px at 100% 0,color-mix(in srgb,var(--acc) 20%,transparent),transparent),var(--bg);background-attachment:fixed;line-height:1.6}
body::before{background:var(--bg)}
h3{letter-spacing:.005em}
.taskbar{margin:12px 16px 0;border:1px solid var(--line);border-radius:20px;top:calc(env(safe-area-inset-top,0px) + 10px);background:color-mix(in srgb,var(--sf) 82%,transparent);backdrop-filter:blur(14px);box-shadow:0 10px 34px #2b3f3810}
.tb-nav button{border-radius:12px;font-size:14px}.tb-nav button.on{background:color-mix(in srgb,var(--pri) 14%,var(--sf));color:var(--pri);font-weight:600}
.view{max-width:1180px;padding:28px 28px 56px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:26px 30px;margin-bottom:22px;border-radius:26px;background:linear-gradient(125deg,#2f6b57,#4f9079);color:#fff;box-shadow:0 18px 44px #2f6b5533}
.hero::after{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:#ffffff16}.hero::before{content:"";position:absolute;right:120px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:#ffffff0f}
.hero img{width:80px;height:80px;border-radius:50%;background:#fff;box-shadow:0 8px 24px #0003;flex:none;position:relative;z-index:1}.hero>div,.hero>button{position:relative;z-index:1}
.hero h1{color:#fff;font-size:27px;line-height:1.2}.hero p{margin:6px 0 0;opacity:.92;font-size:14.5px}
.btn.hbtn{background:#ffffff;color:#2f6b57;border-color:#fff;box-shadow:0 6px 18px #0002}
.btn{border-radius:12px;box-shadow:0 4px 14px color-mix(in srgb,var(--pri) 22%,transparent)}.btn-ghost,.btn.ghost{box-shadow:none;background:color-mix(in srgb,var(--pri) 6%,transparent);border-color:color-mix(in srgb,var(--pri2) 70%,var(--line))}
.stats{gap:18px;margin-bottom:22px}
.stat{--c:var(--pri);border-radius:20px;padding:18px 20px;border-color:transparent;box-shadow:0 8px 30px #2b3f3810;transition:transform .25s,box-shadow .25s}.stat:hover{transform:translateY(-3px);box-shadow:0 14px 36px #2b3f3818}
.stat:nth-child(2){--c:#4f88a0}.stat:nth-child(3){--c:#b0903f}.stat:nth-child(4){--c:#8472a0}.stat:nth-child(5){--c:#c0706a}
.stat .ico{width:48px;height:48px;border-radius:50%;background:color-mix(in srgb,var(--c) 15%,var(--sf));color:var(--c)}.stat b{color:var(--ink);font-size:28px}
.panel,.tw{border-radius:22px;border-color:transparent;box-shadow:0 8px 30px #2b3f3810}.panel{padding:22px 24px}.panel h3{font-size:18px;margin-bottom:14px}
.two{gap:20px;margin-bottom:20px}
.bar{height:6px;background:color-mix(in srgb,var(--pri2) 28%,var(--sf))}.bar i{background:linear-gradient(90deg,var(--pri2),var(--pri))}
.br{font-size:13.5px;margin:12px 0}.br span{color:var(--mut)}.br b{color:var(--ink)}
.li{padding:12px 0;border-bottom:1px dashed var(--line)}
th{background:transparent;color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;padding:14px 16px}td{padding:13px 16px;border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}tbody tr:hover td,tr:hover>td{background:color-mix(in srgb,var(--soft) 55%,transparent)}
tr:last-child td{border-bottom:0}
.sec{border-radius:20px;border-color:transparent;box-shadow:0 8px 26px #2b3f380e;padding:18px}.sec:hover{box-shadow:0 14px 34px #3d7b6624}
.chip{border-color:transparent;background:color-mix(in srgb,var(--soft) 90%,var(--sf))}.chip:hover,.chip.on{background:var(--pri);color:var(--onpri)}
.pill{background:color-mix(in srgb,var(--pri) 12%,var(--sf));color:var(--pri);font-weight:500}.pill.bad{background:color-mix(in srgb,var(--bad) 14%,var(--sf));color:var(--bad)}
.hint{border-radius:16px;background:color-mix(in srgb,var(--acc) 16%,var(--sf));color:var(--ink);padding:14px 18px;line-height:1.55}
.prof{border-radius:26px}input,select{border-radius:12px;border-color:var(--line)}
.search-pop{border-radius:18px;border-color:transparent;box-shadow:0 24px 60px #2b3f3830}.modal-box{border-radius:24px}.modal-body{background:color-mix(in srgb,var(--soft) 80%,var(--bg))}
@media(max-width:900px){.taskbar{margin:8px}.hero{padding:20px}.hero h1{font-size:22px}.view{padding:20px 14px 44px}}
@media print{body{background:#fff!important}.taskbar,.hero{display:none!important}}

  <script>/* Sample data: sections, advisers, students and grades. Replace with your real records. */
const rnd=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const FN=['Maria','Juan','Angela','Carlo','Bea','Miguel','Sofia','Paolo','Jasmine','Ramon','Katrina','Joshua','Clarice','Daniel','Trisha','Enzo','Lea','Marco','Nina','Gabriel'];
const LN=['Santos','Reyes','Dela Cruz','Garcia','Mendoza','Bautista','Ramos','Aquino','Villanueva','Castillo','Flores','Navarro','Torres','Soriano','Domingo','Pascual','Salazar','Manalo','Lacson','Rivera'];
const SUBJ=['Oral Communication','General Mathematics','Earth & Life Science','Physical Education','Filipino','Understanding Culture','Empowerment Tech','Pathway Specialization'];
const ADV=['CABUNGCAL, J','ANGILINAN, J','PAYABYAB, J','CRUZ, N','JAVIER, A','MIRANDA, G','ONDIVILLA, A','VIVAS, N','SORDAN, B','MORENO, E','PINEDA, L'];
const S11=['Adler','Alcazar','Analytical','Augustine','Bernoulli','Bloom','Candu','Chatterton','Commerce','Croissant','Diaz','Driven','Ducent','Entrepreneur','Erudite','Michelin','Patriots','Sapientia'];
const P11=[['BAKCKR','Bakery & Cookery'],['TEACHING','Teaching'],['TRADE 2','Trade 2'],['MEDSCI','Medical Science'],['ENG SCI','Engineering Science'],['F&BFOM/AE','Food & Beverage / Hospitality'],['AUTO','Automotive Technology']];
const S12=[['STEM A','Advanced Mathematics & Pre-Engineering'],['STEM B','General Sciences & Technology'],['ABM A','Accountancy, Business & Management'],['ABM B','Accountancy, Business & Management'],['HUMSS A','Humanities & Social Sciences'],['HUMSS B','Humanities & Social Sciences'],['GAS A','General Academic Strand'],['TVL A','Technical-Vocational Livelihood']];
const secs=[],studs=[];
S11.forEach((n,i)=>secs.push({id:'s'+secs.length,grade:11,name:'11 '+n,path:P11[i%7][0],pname:P11[i%7][1],kind:'Pathway',adv:ADV[i%11]}));
S12.forEach((x,i)=>secs.push({id:'s'+secs.length,grade:12,name:'12 '+x[0],path:x[0].split(' ')[0],pname:x[1],kind:'Strand',adv:ADV[(i+4)%11]}));
secs.forEach((sc,si)=>{const r=rnd(si*77+5);for(let k=0;k<6;k++){const id='st'+studs.length,g=[],b=79+r()*13;for(let j=0;j<8;j++){const row=[];for(let q=0;q<4;q++)row.push(Math.round(Math.min(99,Math.max(72,b+(r()-.5)*10))));g.push(row)}
studs.push({id,sec:sc.id,name:LN[Math.floor(r()*20)].toUpperCase()+', '+FN[Math.floor(r()*20)],lrn:String(136000000000+si*1000+k*37+Math.floor(r()*30)),g})}});
let OV={};try{OV=JSON.parse(localStorage.getItem('actsOv')||'{}')}catch(e){}
Object.keys(OV).forEach(k=>{const[s,j,q]=k.split('|'),st=studs.find(x=>x.id===s);if(st)st.g[j][q]=OV[k]});
const secOf=id=>secs.find(s=>s.id===id),stOf=sc=>studs.filter(s=>s.sec===sc);
const fin=(s,j)=>Math.round(s.g[j].reduce((a,b)=>a+b,0)/4);
const gen=s=>Math.round(s.g.map((_,j)=>fin(s,j)).reduce((a,b)=>a+b,0)/8);
const rem=v=>v>=90?'Outstanding':v>=85?'Very Satisfactory':v>=80?'Satisfactory':v>=75?'Fairly Satisfactory':'Did Not Meet Expectations';
const teachers=ADV.map((n,t)=>({name:n,subj:t%8,adv:secs.filter(s=>s.adv===n).map(s=>s.id),teach:[0,1,2].map(k=>secs[(t*3+k*7+2)%secs.length].id)}));

/* Registrar tracking data: PSA, Form 137, verification, signed grading sheets, card preparation */
const PN=['Rosario','Eduardo','Maricel','Ricardo','Lourdes','Alfredo','Cynthia','Romeo','Evelyn','Ernesto'];
let RC={};try{RC=JSON.parse(localStorage.getItem('actsRec')||'{}')}catch(e){}
(function(){const rr=rnd(991);studs.forEach(s=>{const ln=s.name.split(', ')[0],g12=secOf(s.sec).grade===12;s.parent=PN[Math.floor(rr()*10)]+' '+ln.charAt(0)+ln.slice(1).toLowerCase();s.dob=(2006+Math.floor(rr()*4))+'-'+String(1+Math.floor(rr()*12)).padStart(2,'0')+'-'+String(1+Math.floor(rr()*28)).padStart(2,'0');
s.psa=rr()<.86;s.f137=rr()<.72;s.ver=s.psa&&s.f137&&rr()<.5;const x=rr();s.status=x<.04?(g12?'Graduated':'Transferred'):x<.06?'Stopped':'Enrolled';s.surr=s.status!=='Enrolled'&&rr()<.4;const o=RC.s&&RC.s[s.id];if(o)Object.assign(s,o)});
secs.forEach((sc,i)=>{const r=rnd(i*131+17);sc.sheets=SUBJ.map(()=>r()<.7);sc.prep=r()<.45;const o=RC.c&&RC.c[sc.id];if(o){sc.sheets=o.sheets||sc.sheets;sc.prep=o.prep}})})();

/* Academic Card Tracking System - app logic */
let S={role:null,user:null,view:null,sec:null,q:0,f:0};let LR='admin';

function count(){document.querySelectorAll('.cnt').forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/900);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)})}

function srch(v){v=v.trim().toLowerCase();const P=$('#searchPop');if(!v){P.hidden=true;P.innerHTML='';return}
const a=secs.filter(s=>(s.name+s.path+s.pname+s.adv).toLowerCase().includes(v)).slice(0,6).map(s=>`<div class="sr" data-a="sec" data-p="${s.id}"><b>${s.name}</b><small>${s.kind}: ${s.path} · Adviser ${s.adv}</small></div>`);
const b=studs.filter(s=>(s.name+s.lrn).toLowerCase().includes(v)).slice(0,5).map(s=>`<div class="sr" data-a="rec" data-p="${s.id}"><b>${s.name}</b><small>${secOf(s.sec).name} · LRN ${s.lrn}</small></div>`);

<div class="two"><div class="panel"><h3>Registrar checklist</h3>${pb([['PSA on file',ps,N],['JHS Form 137 on file',f1,N],['Grades verified',vr,N],['Signed grading sheets',sh,sa],['Cards prepared by advisers',pr,secs.length]])}<p class="mut" style="font-size:12.5px;margin:10px 0 0">PSA must show the student’s name, parent’s name and birth date. Open <a href="#" data-a="nav" data-p="records">Records tracker</a> for every section.</p></div>
<div class="panel"><h3>Delays and follow-ups</h3>${late.map(x=>`<div class="li"><span><b>${x.s.name}</b><small>Adviser ${x.s.adv} · ${x.m} item${x.m>1?'s':''} outstanding</small></span><button class="btn sm ghost" data-a="sec" data-p="${x.s.id}">Open</button></div>`).join('')||'<p class="mut">Nothing outstanding.</p>'}
<h3 style="font-size:15px;margin:16px 0 4px">Permanent records awaiting surrender (${sur.length})</h3>${sur.slice(0,4).map(s=>`<div class="li"><span>${s.name}<small>${s.status} · Adviser ${secOf(s.sec).adv} should surrender Form 137</small></span><button class="btn sm ghost" data-a="rec" data-p="${s.id}">Record</button></div>`).join('')||'<p class="mut">None pending.</p>'}</div></div>
<div class="two"><div class="panel"><h3>Performance distribution</h3>${bars(dist,Math.max(...dist.map(d=>d[1]),1))}</div><div class="panel"><h3>Students per pathway and strand</h3>${bars(Object.entries(pc),Math.max(...Object.values(pc)))}</div></div>
<div class="two"><div class="panel"><h3>Top sections by average</h3>${top.map((x,i)=>`<div class="li"><span><b>${i+1}.</b> ${x[0].name}<small>${x[0].adv}</small></span><b>${x[1]}</b></div>`).join('')}</div>
<div class="panel"><h3>Recent activity</h3>${LOG.slice(0,6).map(x=>`<div class="li"><span>${esc(x.u)}<small>${esc(x.a)} · ${new Date(x.t).toLocaleString()}</small></span></div>`).join('')||'<p class="mut">No activity recorded yet.</p>'}</div></div>
<div class="hint"><b>Subject lists:</b> the registrar can provide the Grade 12 core and elective subjects. The Grade 11 core and elective list has not been issued yet and must come from the concerned personnel, so the subjects shown are placeholders. Sections and pathways already apply to both grades.</div>`}
function records(){const rows=secs.map(sc=>{const L=stOf(sc.id),n=L.length,p=L.filter(s=>s.psa).length,f=L.filter(s=>s.f137).length,v=L.filter(s=>s.ver).length,sh=sc.sheets.filter(Boolean).length;return{sc,n,p,f,v,sh,m:(n-p)+(n-f)+(SUBJ.length-sh)}}).sort((x,y)=>y.m-x.m);
$('#view').innerHTML=`<div class="row"><div><h1>Records tracker</h1><span class="mut">Documents and signed grading sheets received by the Registrar’s Office. Sections with the most missing items come first.</span></div></div><div class="tw"><table style="min-width:820px"><tr><th>Section</th><th>Adviser</th><th>PSA</th><th>Form 137</th><th>Verified</th><th>Signed sheets</th><th>Cards prepared</th><th></th></tr>${rows.map(r=>`<tr><td><b>${r.sc.name}</b><br><small class="mut">${r.sc.path}</small></td><td>${r.sc.adv}</td><td>${r.p}/${r.n}</td><td>${r.f}/${r.n}</td><td>${r.v}/${r.n}</td><td>${r.sh}/${SUBJ.length}</td><td>${r.sc.prep?'Yes':'<span class="pill bad">Pending</span>'}</td><td><button class="btn sm ghost" data-a="sec" data-p="${r.sc.id}">Open</button></td></tr>`).join('')}</table></div>`}
function sections(){if(S.sec)return secDetail();const l=secs.filter(s=>!S.f||s.grade===S.f);
$('#view').innerHTML=`<div class="chips">${[[0,'All'],[11,'Grade 11'],[12,'Grade 12']].map(c=>`<button class="chip ${S.f===c[0]?'on':''}" data-a="sf" data-p="${c[0]}">${c[1]}</button>`).join('')}</div>${secGrid(l)}`}
function secDetail(){const sc=secOf(S.sec),L=stOf(sc.id),mk=v=>v?'✓':'<span class="pill bad">Missing</span>';
$('#view').innerHTML=`<button class="btn ghost sm" data-a="back">Back to sections</button><div class="row" style="margin-top:14px"><div><h1>${sc.name}</h1><span class="mut">${sc.kind}: ${sc.pname} · Adviser ${sc.adv}</span></div><button class="btn" data-a="printsec" data-p="${sc.id}">Print all cards</button></div>
<div class="panel" style="margin-bottom:16px"><h3>Signed grading sheets received</h3><p class="mut" style="margin:0 0 8px">Tap a subject once its signed grading sheet is in the Registrar’s Office. It is the backup used to double-check the adviser’s record.</p><div class="chips" style="margin:0">${SUBJ.map((n,j)=>`<button class="chip ${sc.sheets[j]?'on':''}" data-a="sh" data-p="${sc.id}|${j}">${n}${sc.sheets[j]?' ✓':''}</button>`).join('')}</div></div>
<div class="tw"><table><tr><th>Student</th><th>LRN</th><th>PSA</th><th>Form 137</th><th>Verified</th><th>General average</th><th></th></tr>${L.map(s=>`<tr><td>${s.name}${s.status!=='Enrolled'?` <span class="pill bad">${s.status}</span>`:''}</td><td>${s.lrn}</td><td>${mk(s.psa)}</td><td>${mk(s.f137)}</td><td>${s.ver?'✓':'—'}</td><td>${gen(s)}</td><td><button class="btn sm ghost" data-a="rec" data-p="${s.id}">Record</button> <button class="btn sm" data-a="print" data-p="${s.id}">Print</button></td></tr>`).join('')}</table></div>`}
function advisers(){$('#view').innerHTML=`<div class="tw"><table><tr><th>Adviser</th><th>Advisory sections</th><th>Students</th></tr>${teachers.map(t=>`<tr><td><b>${t.name}</b></td><td>${t.adv.map(i=>`<a href="#" data-a="sec" data-p="${i}">${secOf(i).name}</a>`).join(', ')}</td><td>${t.adv.reduce((a,i)=>a+stOf(i).length,0)}</td></tr>`).join('')}</table></div>`}
function audit(){const C=['All','Sign-ins','Failed sign-ins','Grade edits','Records','Cards'];S.af=S.af||'All';const L=LOG.filter(x=>S.af==='All'||cat(x.a)===S.af);
$('#view').innerHTML=`<div class="row"><div><h1>Audit log</h1><span style="color:var(--mut)">${LOG.length} recorded actions · newest first · latest 500 kept</span></div></div><div class="chips">${C.map(c=>`<button class="chip ${S.af===c?'on':''}" data-a="af" data-p="${c}">${c}</button>`).join('')}</div><div class="tw"><table style="min-width:700px"><tr><th>When</th><th>Who</th><th>Role</th><th>Action</th><th>Details</th></tr>${L.length?L.map(x=>`<tr><td>${new Date(x.t).toLocaleString()}</td><td>${esc(x.u)}</td><td><span class="pill">${esc(x.r)}</span></td><td>${esc(x.a)}</td><td>${esc(x.d)}</td></tr>`).join(''):'<tr><td colspan="5">Nothing recorded for this filter yet. Sign-ins, grade edits and card prints appear here.</td></tr>'}</table></div><p class="hint">The log cannot be edited or cleared from this page.</p>`}
function secChips(ids){return `<div class="chips">${ids.map(i=>`<button class="chip ${S.sec===i?'on':''}" data-a="chip" data-p="${i}">${secOf(i).name}</button>`).join('')}</div>`}
const qSel=()=>`<select style="width:auto" data-ch="q">${[1,2,3,4].map((x,i)=>`<option value="${i}" ${S.q===i?'selected':''}>Quarter ${x}</option>`).join('')}</select>`;
function advisory(){const t=S.user;if(!t.adv.length){$('#view').innerHTML='<p>You have no advisory section assigned yet. Ask an admin to assign one.</p>';return}if(!S.sec)S.sec=t.adv[0];const sc=secOf(S.sec);
$('#view').innerHTML=`${secChips(t.adv)}<div class="row"><div><h1>${sc.name}</h1><span style="color:var(--mut)">${sc.kind}: ${sc.pname}</span></div>${qSel()}</div><div class="tw"><table style="min-width:900px"><tr><th>Student</th>${SUBJ.map(s=>`<th>${s}</th>`).join('')}<th>Average</th></tr>${stOf(sc.id).map(s=>`<tr><td>${s.name}</td>${s.g.map(r=>`<td>${r[S.q]}</td>`).join('')}<td><b>${Math.round(s.g.reduce((a,r)=>a+r[S.q],0)/8)}</b></td></tr>`).join('')}</table></div><p class="hint">Advisory view is read-only. Grades are entered by each subject teacher.</p>`}

function tdash(){const t=S.user,adv=t.adv.flatMap(stOf),tl=t.teach.map(i=>[secOf(i),stOf(i)]),sub=tl.flatMap(x=>x[1]);
const sa=sub.length?Math.round(sub.reduce((a,s)=>a+fin(s,t.subj),0)/sub.length):0;
$('#view').innerHTML=`${hero(greet()+', '+esc(t.name),'Teaching '+SUBJ[t.subj]+' · '+t.adv.length+' advisory section'+(t.adv.length===1?'':'s'),`<button class="btn hbtn" data-a="nav" data-p="grades">${ic(IC.book)} Input grades</button>`)}
<div class="stats">${kp(IC.users,adv.length,'Advisory students')}${kp(IC.book,tl.length,'Subject sections')}${kp(IC.chart,avgOf(adv),'Advisory average')}${kp(IC.chart,sa,SUBJ[t.subj]+' average')}</div>
<div class="two"><div class="panel"><h3>My advisory</h3>${t.adv.map(i=>`<div class="li"><span><b>${secOf(i).name}</b><small>${secOf(i).kind}: ${secOf(i).pname} · ${stOf(i).length} students</small></span><span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ghost" data-a="prep" data-p="${i}">${secOf(i).prep?'Cards prepared ✓':'Mark cards prepared'}</button><button class="btn sm ghost" data-a="go" data-p="advisory|${i}">Open</button></span></div>`).join('')||'<p class="mut">No advisory section assigned.</p>'}</div>
<div class="panel"><h3>Subject sections</h3>${tl.map(x=>`<div class="li"><span><b>${x[0].name}</b><small>Class average ${Math.round(x[1].reduce((a,s)=>a+fin(s,t.subj),0)/x[1].length)}</small></span><button class="btn sm" data-a="go" data-p="grades|${x[0].id}">Input grades</button></div>`).join('')}</div></div>`}
function grades(){const t=S.user;if(!S.sec||!t.teach.includes(S.sec))S.sec=t.teach[0];const sc=secOf(S.sec),L=stOf(sc.id);
$('#view').innerHTML=`<div class="row"><div><h1>Input grades</h1><span class="mut">${SUBJ[t.subj]} · ${sc.name} · ${sc.kind}: ${sc.pname}</span></div><div class="row" style="margin:0"><select class="sel" data-ch="gs" aria-label="Section">${t.teach.map(i=>`<option value="${i}" ${i===S.sec?'selected':''}>${secOf(i).name}</option>`).join('')}</select><select class="sel" data-ch="gq" aria-label="Quarter">${[1,2,3,4].map((x,i)=>`<option value="${i}" ${S.q===i?'selected':''}>Quarter ${x}</option>`).join('')}</select></div></div>
<div class="tw"><table><tr><th>#</th><th>Student</th><th>LRN</th><th>Quarter ${S.q+1} grade</th><th>Final (4 quarters)</th></tr>${L.map((s,i)=>`<tr><td>${i+1}</td><td>${s.name}</td><td>${s.lrn}</td><td><input class="gi" type="number" min="60" max="100" step="1" inputmode="numeric" value="${s.g[t.subj][S.q]}" data-s="${s.id}" aria-label="Grade for ${s.name}"></td><td><b>${fin(s,t.subj)}</b></td></tr>`).join('')}</table></div>
<div class="row" style="margin-top:14px"><span class="mut">Whole numbers from 60 to 100. Changes are kept when you press Save.</span><button class="btn" data-a="saveg">Save grades</button></div>`}
function saveg(){const t=S.user;let n=0,bad=0;document.querySelectorAll('.gi').forEach(i=>{const v=+i.value,s=studs.find(x=>x.id===i.dataset.s);i.classList.remove('bad');if(i.value===''||!(v>=60&&v<=100)){i.classList.add('bad');bad++;return}if(Math.round(v)!==s.g[t.subj][S.q]){setG(s.id,t.subj,S.q,v);n++}});
if(bad)return toast(bad+(bad>1?' grades need':' grade needs')+' a value from 60 to 100.',1);toast(n?'Saved '+n+' updated grade'+(n>1?'s':'')+' for '+secOf(S.sec).name+'.':'No changes to save.');if(n)grades()}
function child(){const s=S.user,sc=secOf(s.sec),qa=[0,1,2,3].map(q=>['Quarter '+(q+1),Math.round(s.g.reduce((a,r)=>a+r[q],0)/8)]);
$('#view').innerHTML=`<div class="panel prof"><div class="av lg">${ini(s.name)}</div><div style="flex:1"><h1>${s.name}</h1><span style="color:var(--mut)">${sc.name} · ${sc.kind}: ${sc.pname} · LRN ${s.lrn}</span></div><button class="btn" data-a="print" data-p="${s.id}">Print report card</button></div>
<div class="stats">${kp(IC.chart,gen(s),'General average')}<div class="stat"><div class="ico">${ic(IC.user)}</div><div><b style="font-size:17px">${sc.adv}</b><span>Class adviser</span></div></div><div class="stat"><div class="ico">${ic(IC.shield)}</div><div><b style="font-size:17px">${rem(gen(s))}</b><span>Standing</span></div></div></div>

function showCards(ids,pr,label){$('.modal-head h3').textContent='Student Academic Card';S.pl=label;S.pn=ids.length;$('#printArea').innerHTML=ids.map(id=>cardHTML(studs.find(s=>s.id===id))).join('');$('#printModal').hidden=false;if(pr){log('Printed card'+(ids.length>1?'s':''),label);setTimeout(()=>window.print(),150)}else log('Viewed card',label)}
const cs=()=>{$('#searchInput').value='';$('#searchPop').hidden=true};
const nmOf=id=>studs.find(s=>s.id===id).name;
function setRole(r){LR=r;document.querySelectorAll('.role-tab').forEach(b=>b.classList.toggle('is-active',b.dataset.role===r));$('#loginUser').placeholder={admin:'Enter username',teacher:'Enter username (your surname)',parent:"Enter your child's LRN"}[r];$('#loginError').hidden=true}
function chips(){$('#demoChips').innerHTML=[['admin','Admin'],['teacher','Teacher · '+ADV[0]],['parent','Parent · '+studs[0].name.split(', ')[1]]].map(c=>`<button type="button" class="chip" data-a="demo" data-p="${c[0]}">${esc(c[1])}</button>`).join('')}
function tryLogin(role,u,p){const ul=u.trim().toLowerCase();let ok=false;
if(role==='admin'&&ul==='admin'&&p==='admin123'){S={...S,role,user:'Administrator',view:'overview',sec:null};ok=true}
else if(role==='teacher'){const tc=teachers.find(x=>tUser(x.name)===ul);if(tc&&p==='teacher123'){S={...S,role,user:tc,view:'tdash',sec:null,q:0};ok=true}}
else if(role==='parent'){const st=studs.find(x=>x.lrn===u.trim());if(st&&p==='1234'){S={...S,role,user:st,view:'child',sec:null};ok=true}}
if(!ok){log('Failed sign-in',role+' \u00b7 '+u.trim().slice(0,40),'Not signed in','none');const e=$('#loginError');e.textContent='Those details do not match a '+role+' account. Please check and try again.';e.hidden=false;return}
log('Signed in');$('#loginScreen').hidden=true;$('#app').hidden=false;$('#printModal').hidden=true;shell()}
const A={nav,sec:p=>{cs();openSec(p)},back:()=>{S.sec=null;shell()},sf:p=>{S.f=+p;sections()},chip:p=>{S.sec=p;advisory()},go:p=>{const x=p.split('|');S.view=x[0];S.sec=x[1];shell()},af:p=>{S.af=p;audit()},saveg,
card:p=>{cs();showCards([p],false,nmOf(p))},print:p=>showCards([p],true,nmOf(p)),printsec:p=>showCards(stOf(p).map(s=>s.id),true,secOf(p).name+' \u00b7 '+stOf(p).length+' cards'),
demo:p=>{const c={admin:['admin','admin123'],teacher:[tUser(ADV[0]),'teacher123'],parent:[studs[0].lrn,'1234']}[p];setRole(p);$('#loginUser').value=c[0];$('#loginPass').value=c[1];tryLogin(p,c[0],c[1])}};
document.addEventListener('click',e=>{const t=e.target,b=t.closest('[data-a]'),rt=t.closest('.role-tab');
if(b){e.preventDefault();A[b.dataset.a](b.dataset.p)}else if(rt)setRole(rt.dataset.role);else if(t.closest('[data-close]'))$('#printModal').hidden=true;
if(!t.closest('.tb-search'))$('#searchPop').hidden=true});
document.addEventListener('change',e=>{const d=e.target.dataset||{};if(d.ch==='q'){S.q=+e.target.value;advisory()}if(d.ch==='gs'){S.sec=e.target.value;grades()}if(d.ch==='gq'){S.q=+e.target.value;grades()}});
$('#searchInput').addEventListener('input',e=>srch(e.target.value));
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();tryLogin(LR,$('#loginUser').value,$('#loginPass').value)});
$('#doPrint').addEventListener('click',()=>{log('Printed card'+(S.pn>1?'s':''),S.pl||'');window.print()});
$('#logoutBtn').addEventListener('click',()=>{log('Signed out');S.role=null;$('#printModal').hidden=true;$('#app').hidden=true;$('#loginScreen').hidden=false;$('#loginUser').value='';$('#loginPass').value='';setRole('admin')});

function saveRec(){const s={},c={};studs.forEach(x=>{s[x.id]={psa:x.psa,f137:x.f137,ver:x.ver,surr:x.surr,status:x.status}});secs.forEach(x=>{c[x.id]={sheets:x.sheets,prep:x.prep}});try{localStorage.setItem('actsRec',JSON.stringify({s,c}))}catch(e){}}
const LAB={psa:'PSA birth certificate',f137:'JHS Form 137',ver:'Grades verified',surr:'Permanent record surrendered'};
function recHTML(s){const sc=secOf(s.sec),dob=new Date(s.dob+'T00:00:00').toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'}),row=(k,l,d)=>`<div class="li"><span>${l}<small>${d}</small></span><button class="chip ${s[k]?'on':''}" data-a="tg" data-p="${s.id}|${k}">${s[k]?'On file ✓':'Missing · mark received'}</button></div>`;
return `<div class="panel noprint"><div class="row" style="margin:0 0 6px"><div><h3>${esc(s.name)}</h3><span class="mut">LRN ${s.lrn} · ${sc.name} · Adviser ${sc.adv}</span></div><select class="sel" data-ch="stat" data-s="${s.id}" aria-label="Enrolment status">${['Enrolled','Transferred','Stopped','Graduated'].map(x=>`<option ${s.status===x?'selected':''}>${x}</option>`).join('')}</select></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;margin:8px 0"><span><b>Complete name:</b> ${esc(s.name)}</span><span><b>Parent (per PSA):</b> ${esc(s.parent)}</span><span><b>Date of birth:</b> ${dob}</span><span><b>${sc.kind}:</b> ${sc.pname}</span></div>
${row('psa','PSA birth certificate attached','Shows the student’s complete name, parent’s name and date of birth')}${row('f137','Junior High School record (Form 137)','Permanent record from Junior High School')}${row('ver','Grades verified','Checked against the signed grading sheets kept in the Registrar’s Office')}${s.status!=='Enrolled'?row('surr','Permanent record surrendered by adviser','Due when a student graduates, stops or transfers'):''}</div>`}
function showRec(id){const s=studs.find(x=>x.id===id);$('.modal-head h3').textContent='Student record';$('#printArea').innerHTML=recHTML(s)+cardHTML(s);$('#printModal').hidden=false;S.pl=s.name;S.pn=1}
A.rec=p=>{cs();log('Viewed record',nmOf(p));showRec(p)};
A.tg=p=>{const x=p.split('|'),s=studs.find(q=>q.id===x[0]);s[x[1]]=!s[x[1]];saveRec();log('Record update',s.name+' · '+LAB[x[1]]+': '+(s[x[1]]?'received':'unmarked'));showRec(s.id);shell(1)};
A.sh=p=>{const x=p.split('|'),sc=secOf(x[0]),j=+x[1];sc.sheets[j]=!sc.sheets[j];saveRec();log('Sheet received',sc.name+' · '+SUBJ[j]+': '+(sc.sheets[j]?'signed sheet received':'unmarked'));secDetail()};
A.prep=p=>{const sc=secOf(p);sc.prep=!sc.prep;saveRec();log('Card prepared',sc.name+(sc.prep?': cards prepared by adviser':': unmarked'));shell(1)};
document.addEventListener('change',e=>{const d=e.target.dataset||{};if(d.ch==='stat'){const s=studs.find(x=>x.id===d.s);s.status=e.target.value;if(s.status==='Enrolled')s.surr=false;saveRec();log('Record update',s.name+' · status: '+s.status);showRec(s.id);shell(1)}});
chips();setRole('admin');
</script>
